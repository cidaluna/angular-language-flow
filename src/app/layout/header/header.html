<header class="app-header">
  <span class="app-header__brand" id="header-brand" >{{ 'header.brand' | transloco }}</span>
  <span class="app-header__about" id="header-about" data-walkthrough="about">{{ 'header.about' | transloco }}</span>
  <span class="app-header__contact" id="header-contact" data-walkthrough="contact">{{ 'header.contact' | transloco }}</span>

  <div class="app-header__controls" id="header-language" data-walkthrough="language">
    <label class="app-header__field">
      {{ 'header.languageLabel' | transloco }}
      <select
        class="app-header__select"
        [value]="currentLang()"
        (change)="onLanguageChange($event)"
      >
        @for (lang of languages; track lang) {
          <option [value]="lang.code" data-walkthrough="language-open">
            {{ lang.label }}
          </option>
        }
      </select>
    </label>

  </div>
</header>
<app-walkthrough
  [steps]="walkthroughSteps"
  storageKey="header"
  [show]="true"
  [markSeenOnSkip]="false"
/>
