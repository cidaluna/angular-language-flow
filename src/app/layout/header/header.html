<header class="app-header">
  <span class="app-header__brand" id="header-brand">{{ 'header.brand' | transloco }}</span>
  <span class="app-header__brand" id="header-about">{{ 'header.about' | transloco }}</span>
  <span class="app-header__brand" id="header-contact">{{ 'header.contact' | transloco }}</span>

  <div class="app-header__controls" id="header-language-selector">
    <label class="app-header__field">
      {{ 'header.languageLabel' | transloco }}
      <select
        class="app-header__select"
        [value]="currentLang()"
        (change)="onLanguageChange($event)"
      >
        @for (lang of languages; track lang) {
          <option [value]="lang.code">
            {{ lang.label }}
          </option>
        }
      </select>
    </label>

  </div>
</header>
