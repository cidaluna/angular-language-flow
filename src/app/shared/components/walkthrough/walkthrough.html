@if (show()) {
  <!-- Escurece a tela só quando NÃO há elemento destacado (ex.: step de boas-vindas).
       Com alvo, quem escurece é o spotlight, via box-shadow. -->
  <div
    class="walkthrough-overlay"
    [class.walkthrough-overlay--dimmed]="!targetVisible()"
    aria-hidden="true"
  ></div>

  @if (targetVisible()) {
    <div class="walkthrough-spotlight" [style]="spotlightStyle()" aria-hidden="true"></div>
  }

  @if (currentStep(); as step) {
    <section
      #card
      class="walkthrough-step"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="descriptionId"
      [style]="stepStyle()"
      (keydown)="onCardKeydown($event)"
    >
      <header class="walkthrough-header">
        <!-- aria-hidden: o título abaixo já anuncia "Passo X de Y" ao leitor de tela -->
        <div class="walkthrough-card__progress" aria-hidden="true">
          <span class="walkthrough-card__dots">
            @for (dot of stepDots(); track dot) {
              <span
                class="walkthrough-card__dot"
                [class.walkthrough-card__dot--active]="dot <= stepIndex()"
              ></span>
            }
          </span>
          <span>{{ displayedStepIndex() }} de {{ totalSteps() }}</span>
        </div>

        <button
          type="button"
          class="walkthrough-close"
          aria-label="Fechar tour"
          (click)="skip()"
        >×</button>
      </header>

      <div class="walkthrough-content">
        <h3 class="walkthrough-title" [id]="titleId">
          <span class="sr-only">Passo {{ displayedStepIndex() }} de {{ totalSteps() }}: </span>{{ step.title }}
        </h3>
        <p class="walkthrough-description" [id]="descriptionId">{{ step.description }}</p>
      </div>

      <footer class="walkthrough-footer">
        @if (firstStep()) {
          <button
            type="button"
            class="walkthrough-button walkthrough-button-secondary"
            (click)="skip()"
          >Pular tour</button>
        } @else {
          <button
            type="button"
            class="walkthrough-button walkthrough-button-secondary"
            (click)="previous()"
          >Voltar</button>
        }

        <button
          type="button"
          class="walkthrough-button walkthrough-button-primary"
          (click)="next()"
        >{{ lastStep() ? 'Concluir' : 'Próximo' }}</button>
      </footer>
    </section>
  }
}
