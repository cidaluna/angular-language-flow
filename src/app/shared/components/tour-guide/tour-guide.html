@if (isActive() && currentStep(); as step) {
  <div class="tour-overlay" (click)="closeClick.emit()"></div>

  <div
    class="tour-spotlight"
    [class.is-last-step]="isLastStep()"
    [class.is-ready]="isPositionReady()"
    [style.top.px]="spotlight().top"
    [style.left.px]="spotlight().left"
    [style.width.px]="spotlight().width"
    [style.height.px]="spotlight().height"
  ></div>

  <div
    #tourContainer
    class="tour-bubble"
    [class]="'position-' + step.position"
    [class.is-mobile]="isMobileLayout()"
    [class.is-top-collided]="isTopCollided()"
    [class.is-ready]="isPositionReady()"
    [style.top.px]="bubbleTop()"
    [style.left.px]="bubbleLeft()"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="'tour-title-' + step.id"
  >
    <section class="tour-card">
      <header class="tour-header">
        <div class="tour-progress">
          <div class="dots-container">
            @for (s of steps(); track s.id; let idx = $index) {
              <span class="dot" [class.active]="idx <= currentStepIndex()"></span>
            }
          </div>
          <span class="counter">
            {{ currentStepIndex() + 1 }} de {{ steps().length }}
          </span>
        </div>
        <button class="btn-close" (click)="closeClick.emit()" aria-label="Fechar tour">&times;</button>
      </header>

      <div class="tour-content">
        <h3 [id]="'tour-title-' + step.id">{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </div>

      <footer class="tour-footer">
        @if (currentStepIndex() === 0) {
          <button class="btn-action link" (click)="skipClick.emit()">Pular tour</button>
        } @else {
          <button class="btn-action link" (click)="previousClick.emit()">Voltar</button>
        }

        @if (isLastStep()) {
          <button class="btn-action primary" (click)="completeClick.emit()">Concluir</button>
        } @else {
          <button class="btn-action primary" (click)="nextClick.emit()">Próximo</button>
        }
      </footer>
    </section>
  </div>
}
